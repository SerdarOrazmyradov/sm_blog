# This file was auto-generated by the Firebase CLI & updated for Hugo
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Kodlary we themes (submodule) çekmek
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # 2. Runner maşyna Hugony gurnamak
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      # 3. Saýty build etmek (public/ papkasy döreýär)
      - name: Build Hugo
        run: hugo --minify

      # 4. Firebase Hosting-e avtomat deploy etmek
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0921879685 }}
          channelId: live
          projectId: gen-lang-client-0921879685