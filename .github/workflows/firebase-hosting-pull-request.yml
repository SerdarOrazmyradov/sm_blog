# This file was auto-generated by the Firebase CLI & updated for Hugo
name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      # 1. Kodlary we themes (submodule) çekmek
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # 2. Runner maşyna Hugony gurnamak
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      # 3. Saýty build etmek
      - name: Build Hugo
        run: hugo --minify

      # 4. PR üçin wagtlaýyn Preview Link döretmek
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0921879685 }}
          projectId: gen-lang-client-0921879685